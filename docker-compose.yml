version: '3.8'

services:
  groww-smart-watchlist:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: groww-catchup-app
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Kolkata
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/watchlists/1/delta || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
