<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Catch-Up — Smart Market Watchlist</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <div class="catchup-card">
            <div class="catchup-header">
                <h2>Catch-Up</h2>
            </div>
            <div id="movers-list"></div>
            <div id="quiet-drawer" class="quiet-drawer">
                <button id="quiet-toggle-btn" class="quiet-btn">0 quiet stocks</button>
                <div id="quiet-content" class="quiet-content hidden">
                    <p class="quiet-note">Stagnant / unchanged stocks recede quietly into background.</p>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
